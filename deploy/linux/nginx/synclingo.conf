server {
    listen 80;
    server_name sync.example.com www.sync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sync.example.com www.sync.example.com;

    root /var/www/si;
    index index.html;

    client_max_body_size 100m;

    # 带哈希名的前端静态资源(JS/CSS)可长期缓存：文件名随每次构建变化，更新即自动失效。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 与 SPA 路由回退：禁用缓存，确保部署后浏览器立即取到最新入口，
    # 避免「点链接看到旧版、复制到浏览器才正常」的缓存问题。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Microsoft Bot Framework messages go directly to the C# Bot.
    location = /api/messages {
        proxy_pass http://127.0.0.1:3978;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Browser-triggered Teams operations must pass through Java authorization first.
    location /bot-api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
