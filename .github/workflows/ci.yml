name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - final-version

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: si-backend
        run: mvn -q test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: si-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: si-frontend
        run: npm ci
      - name: Frontend build
        working-directory: si-frontend
        run: npm run build

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'
      - name: Build Teams Bot
        working-directory: bot/CallingBotSample
        run: dotnet build CallingBotSample.csproj
      - name: Bot tests
        working-directory: bot/CallingBotSample.Tests
        run: dotnet test CallingBotSample.Tests.csproj

  speaker-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python syntax check
        working-directory: speaker-service
        run: python -m compileall -q .
