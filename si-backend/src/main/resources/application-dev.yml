server:
  port: 8080

app:
  websocket:
    max-text-size: 10485760
    max-binary-size: 10485760

azure:
  speech:
    key: YOUR_AZURE_SPEECH_KEY
    region: southeastasia
    asr:
      language: ${AZURE_ASR_LANGUAGES:zh-CN,id-ID,en-US}
      sample-rate: 16000
      end-silence-timeout-ms: ${AZURE_ASR_END_SILENCE_TIMEOUT_MS:1200}
      segmentation-silence-timeout-ms: ${AZURE_ASR_SEGMENTATION_SILENCE_TIMEOUT_MS:300}
      segmentation-strategy: ${AZURE_ASR_SEGMENTATION_STRATEGY:}
      segmentation-maximum-time-ms: ${AZURE_ASR_SEGMENTATION_MAXIMUM_TIME_MS:0}
      force-segment-ms: ${AZURE_ASR_FORCE_SEGMENT_MS:0}
      sentence-segmentation-enabled: ${AZURE_ASR_SENTENCE_SEGMENTATION_ENABLED:true}
      max-segment-zh-chars: ${AZURE_ASR_MAX_SEGMENT_ZH_CHARS:50}
      max-segment-words: ${AZURE_ASR_MAX_SEGMENT_WORDS:50}
      max-segment-chars: ${AZURE_ASR_MAX_SEGMENT_CHARS:80}
    tts:
      sample-rate: 24000

google:
  translate:
    api-key: YOUR_GOOGLE_TRANSLATE_API_KEY

cartesia:
  api-key: YOUR_CARTESIA_API_KEY

logging:
  level:
    root: INFO
    com.si.backend: DEBUG
    com.si.backend.integration: DEBUG
    com.si.backend.ws: DEBUG
    com.si.backend.service: DEBUG
