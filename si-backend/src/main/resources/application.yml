server:
  port: ${APP_PORT:8080}
  address: ${APP_HOST:0.0.0.0}
  tomcat:
    websocket:
      max-text-message-size: 10485760
      max-binary-message-size: 10485760

spring:
  application:
    name: si-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:si_backend}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ysl666}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.si.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    com.si.backend: DEBUG
    org.apache.pdfbox: WARN
    org.apache.fontbox: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/si-backend.log
    max-size: 10MB
    max-history: 7

azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}
    asr:
      model: default
      # Use "auto" for auto-detect or comma-separated languages, such as "zh-CN,id-ID,en-US".
      language: ${AZURE_ASR_LANGUAGES:zh-CN,id-ID,en-US}
      sample-rate: 16000
      format: audio/pcm
      channels: 1
      end-silence-timeout-ms: ${AZURE_ASR_END_SILENCE_TIMEOUT_MS:1200}
      segmentation-silence-timeout-ms: ${AZURE_ASR_SEGMENTATION_SILENCE_TIMEOUT_MS:300}
      segmentation-strategy: ${AZURE_ASR_SEGMENTATION_STRATEGY:}
      segmentation-maximum-time-ms: ${AZURE_ASR_SEGMENTATION_MAXIMUM_TIME_MS:0}
      # run-on 长句兜底：说话超过此 ms 仍无句末标点 → 在安全边界强切(防长句拖高延迟)；0=关闭。
      force-segment-ms: ${AZURE_ASR_FORCE_SEGMENT_MS:6000}
      sentence-segmentation-enabled: ${AZURE_ASR_SENTENCE_SEGMENTATION_ENABLED:true}
      # 长句强切：单调下标 + 稳定前缀 + 安全边界(标点>逗号>词/字) + 留尾余量，不吞句首字、不失控刷段。
      # 默认开启、只切 run-on 长句(中文>66字 / 拉丁>28词);正常短句不切。置 0 可关。
      max-segment-zh-chars: ${AZURE_ASR_MAX_SEGMENT_ZH_CHARS:66}
      max-segment-words: ${AZURE_ASR_MAX_SEGMENT_WORDS:28}
      max-segment-chars: ${AZURE_ASR_MAX_SEGMENT_CHARS:0}
      diarize-intermediate-results: ${AZURE_ASR_DIARIZE_INTERMEDIATE_RESULTS:true}
    tts:
      voice: zh-CN-XiaoxiaoMultilingualNeural
      sample-rate: 24000
  translator:
    key: ${AZURE_TRANSLATOR_KEY:}
    region: ${AZURE_TRANSLATOR_REGION:eastus}
    timeout-seconds: 30
speaker:
  service:
    enabled: ${SPEAKER_SERVICE_ENABLED:false}
    url: ${SPEAKER_SERVICE_URL:http://localhost:7000}
    min-score: ${SPEAKER_SERVICE_MIN_SCORE:0.4}
    switch-score: ${SPEAKER_SERVICE_SWITCH_SCORE:0.45}
    margin-threshold: ${SPEAKER_SERVICE_MARGIN_THRESHOLD:0.06}
    timeout-seconds: ${SPEAKER_SERVICE_TIMEOUT_SECONDS:15}

google:
  translate:
    api-key: ${GOOGLE_TRANSLATE_API_KEY:}
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  referer: ${OPENAI_REFERER:}
  title: ${OPENAI_TITLE:syncLingo-plus}
  compression-enabled: ${OPENAI_COMPRESSION_ENABLED:true}
  compression-min-text-length: ${OPENAI_COMPRESSION_MIN_TEXT_LENGTH:80}
  compression-model: ${OPENAI_COMPRESSION_MODEL:anthropic/claude-haiku-4.5}
  compression-zh-to-id-target-ratio: ${OPENAI_COMPRESSION_ZH_TO_ID_TARGET_RATIO:0.60}
  compression-zh-to-en-enabled: ${OPENAI_COMPRESSION_ZH_TO_EN_ENABLED:true}
  compression-zh-to-en-target-ratio: ${OPENAI_COMPRESSION_ZH_TO_EN_TARGET_RATIO:0.70}
  summary-model: ${OPENAI_SUMMARY_MODEL:deepseek/deepseek-v4-pro}
  document-summary-model: ${OPENAI_DOCUMENT_SUMMARY_MODEL:deepseek/deepseek-v4-pro}
  compression-max-output-tokens: ${OPENAI_COMPRESSION_MAX_OUTPUT_TOKENS:512}
  summary-max-output-tokens: ${OPENAI_SUMMARY_MAX_OUTPUT_TOKENS:1200}
  document-summary-max-output-tokens: ${OPENAI_DOCUMENT_SUMMARY_MAX_OUTPUT_TOKENS:4000}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:openai/text-embedding-3-small}
  # Optional separate endpoint for embeddings (blank = reuse openai.base-url / openai.api-key).
  # OpenRouter serves embeddings too, so chat + embeddings can share one key/base.
  embedding-base-url: ${OPENAI_EMBEDDING_BASE_URL:}
  embedding-api-key: ${OPENAI_EMBEDDING_API_KEY:}
  embedding-top-k: ${OPENAI_EMBEDDING_TOP_K:20}
  embedding-min-score: ${OPENAI_EMBEDDING_MIN_SCORE:0.3}
  # RAG quality (P0) — default off; flip on to improve cross-meeting Q&A retrieval.
  rag-query-expansion-enabled: ${OPENAI_RAG_QUERY_EXPANSION_ENABLED:false}
  rag-query-expansion-count: ${OPENAI_RAG_QUERY_EXPANSION_COUNT:2}
  rag-rerank-enabled: ${OPENAI_RAG_RERANK_ENABLED:false}
  rag-rerank-top-k: ${OPENAI_RAG_RERANK_TOP_K:12}
  rag-helper-model: ${OPENAI_RAG_HELPER_MODEL:}

# RAG chunking + retrieval (Phase 1: sentence-aware chunking + Small-to-Big window expansion)
rag:
  chunking:
    mode: ${RAG_CHUNKING_MODE:smart}            # smart = sentence-aware + overlap; fixed = legacy fixed-length
    target-size: ${RAG_CHUNKING_TARGET_SIZE:300} # target chunk size in chars
    overlap: ${RAG_CHUNKING_OVERLAP:60}          # overlap between adjacent chunks (~1 sentence)
  retrieval:
    window-pad: ${RAG_RETRIEVAL_WINDOW_PAD:400}  # chars of original text on each side of a matched chunk
  hybrid:                                          # Phase 2A: dense cosine + in-memory BM25, fused via RRF
    enabled: ${RAG_HYBRID_ENABLED:true}
    rrf-k: ${RAG_HYBRID_RRF_K:60}
    bm25-k1: ${RAG_HYBRID_BM25_K1:1.2}
    bm25-b: ${RAG_HYBRID_BM25_B:0.75}
  contextual:                                       # Phase 2B: LLM-situated chunk before embedding (off by default)
    enabled: ${RAG_CONTEXTUAL_ENABLED:false}
    model: ${RAG_CONTEXTUAL_MODEL:anthropic/claude-haiku-4.5}
  query-rewrite:                                     # P0-3: resolve pronouns/ellipsis from chat history
    enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
    history-turns: ${RAG_QUERY_REWRITE_HISTORY_TURNS:5}
  decompose:                                         # P1-4: split multi-hop / comparison questions
    enabled: ${RAG_DECOMPOSE_ENABLED:true}
    max: ${RAG_DECOMPOSE_MAX:3}
  insight:                                            # P1-5: extract decisions/risks/metrics/topics as retrievable items
    enabled: ${RAG_INSIGHT_ENABLED:true}
    max-per-category: ${RAG_INSIGHT_MAX_PER_CATEGORY:12}
  hierarchical:                                        # P2-7: cross-meeting overview (RAPTOR-lite root node)
    enabled: ${RAG_HIERARCHICAL_ENABLED:true}
    max-meetings: ${RAG_HIERARCHICAL_MAX_MEETINGS:30}
  agentic:                                             # P2-8: iterative retrieve→judge→follow-up (off by default)
    enabled: ${RAG_AGENTIC_ENABLED:false}
    max-steps: ${RAG_AGENTIC_MAX_STEPS:3}

cartesia:
  api-key: ${CARTESIA_API_KEY:}
  api-url: ${CARTESIA_API_URL:wss://api.cartesia.ai}
  default-voice-id-chinese: ${CARTESIA_DEFAULT_VOICE_ID_ZH:6eb8965c-e295-47bd-a9e4-3eeebb3abcff}
  default-voice-id-indonesian: ${CARTESIA_DEFAULT_VOICE_ID_ID:a053f6bc-7df4-40de-96d4-de026bc47ce8}
  default-voice-id-english: ${CARTESIA_DEFAULT_VOICE_ID_EN:default}
  clone-enhance: ${CARTESIA_CLONE_ENHANCE:false}
  tts:
    model: sonic
    sample-rate: 24000
    container: raw
  pool:
    max-total-per-voice: 4    # 全局共用池：TTS 并发上限（贴合 Cartesia 账户 5 并发，留 1 余量）
    min-idle-per-voice: 0     # 不常驻空闲连接（连接合成完即关，避免空占并发额度）
    max-wait-millis: 5000


jwt:
  secret: ${JWT_SECRET:change_this_secret_to_random_32_plus_chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  admin:
    api-secret: ${ADMIN_API_SECRET:}
  cost:
    # 费率默认值按各家官网（2026-06）：可用环境变量按实际套餐/单价覆盖。
    rates:
      # Azure 语音转文本（实时/标准）≈ $1/音频小时
      asr-per-hour-usd: ${COST_ASR_PER_HOUR_USD:1.00}
      # Azure Translator 标准 S1 ≈ $10 / 百万字符
      trans-per-million-chars-usd: ${COST_TRANS_PER_MILLION_CHARS_USD:10.00}
      # Cartesia Sonic：1 credit/字符，折合 ≈ $35 / 百万字符（克隆音色 1.5×≈$52，按实际套餐调）
      tts-per-million-chars-usd: ${COST_TTS_PER_MILLION_CHARS_USD:35.00}
      # 实时压缩用 Claude Haiku 4.5：输入 $1 / 百万 tokens，输出 $5 / 百万 tokens
      llm-in-per-million-tokens-usd: ${COST_LLM_IN_PER_MILLION_TOKENS_USD:1.00}
      llm-out-per-million-tokens-usd: ${COST_LLM_OUT_PER_MILLION_TOKENS_USD:5.00}
      # 会议总结/文档用 DeepSeek V4 Pro：输入 $1.74 / 百万 tokens，输出 $3.48 / 百万 tokens
      summary-llm-in-per-million-tokens-usd: ${COST_SUMMARY_LLM_IN_PER_MILLION_TOKENS_USD:1.74}
      summary-llm-out-per-million-tokens-usd: ${COST_SUMMARY_LLM_OUT_PER_MILLION_TOKENS_USD:3.48}
    budget:
      monthly-usd: ${COST_BUDGET_MONTHLY_USD:0.0}
      session-usd: ${COST_BUDGET_SESSION_USD:0.0}

bot:
  api:
    url: ${BOT_API_URL:http://localhost:3978}

# 会议通知(根据会议安排名单匹配用户→发 Teams 卡片)
notification:
  teams-domain: ${NOTIFICATION_TEAMS_DOMAIN:jlg.co.id}   # 邮箱以此结尾 = Teams 用户
  test-mode: ${NOTIFICATION_TEST_MODE:false}             # true=只发给 test-recipient；false=发给全部匹配的 Teams 用户
  test-recipient: ${NOTIFICATION_TEST_RECIPIENT:yousanlong@jlg.co.id}

teams:
  bot:
    default-user-id: ${TEAMS_BOT_DEFAULT_USER_ID:0}

audio:
  record:
    dir: ${AUDIO_RECORD_DIR:/app/audio-records}
    max-sessions: ${TEAMS_BOT_MAX_SESSIONS:5}
    summary-preview-chars: ${TEAMS_BOT_SUMMARY_PREVIEW_CHARS:1200}
    api-secret: ${TEAMS_BOT_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
